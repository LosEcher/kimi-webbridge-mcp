# Opt-in overlay: expose the local Kimi WebBridge daemon's tools to DSH
# through @deepseek-ai/dsh-mcp-client. The model sees them as
# `mcp__webbridge__navigate`, `mcp__webbridge__snapshot`, ... .
#
# Prerequisites:
#   1. Kimi WebBridge installed:  ~/.kimi-webbridge/bin/kimi-webbridge status
#   2. (runtime) the browser extension is connected — otherwise tools fail
#      with "no extension connected" and the model should tell the user.
#
# Enable by merging this `insert` into $DSH_HOME/cordis.patch.yml (or use
# `dsh web --patch <path/to/this/file>` for a one-off run). When the bundle
# is installed via `dsh plugin add`, `command: webbridge-mcp` resolves
# through the profile's node_modules/.bin; otherwise replace it with
# `command: node` + `args: ['/absolute/path/to/kimi-webbridge-mcp/server.mjs']`.
- insert:
    - id: mcp-webbridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: webbridge
        transport: stdio
        command: webbridge-mcp
        env:
          WEBBRIDGE_MCP_AUTOSTART: '1'

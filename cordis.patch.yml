# kimi-webbridge-mcp bundle patch.
# Install:  dsh plugin --profile web add github:LosEcher/kimi-webbridge-mcp#main
# Exposes the local Kimi WebBridge daemon's tools through DSH's MCP bridge as
# mcp__webbridge__*. Requires the browser extension connected at runtime.
#
# Portable command: `webbridge-mcp` is the package bin entry (created by
# pnpm in the profile's node_modules/.bin when the bundle is installed via
# `dsh plugin add`). If your dsh process PATH does not include that .bin
# directory, override this row in your user patch layer with an explicit
# `command: node` + `args: ['/absolute/path/to/server.mjs']`.
- insert:
    - id: mcp-webbridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: webbridge
        transport: stdio
        command: webbridge-mcp
        env:
          WEBBRIDGE_MCP_AUTOSTART: '1'
